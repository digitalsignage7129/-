<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 画面全体の余白を消す */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        /* 窓の大きさ（サイネージの画面全体） */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 中身の調整 */
        iframe {
            position: absolute;
            border: none;
            
            /* ★★★ ここから下の数字を微調整します ★★★ */

            /* 1. 大きさ（今の「いい感じ」の倍率のまま固定） */
            /* 左右がはみ出さない、ちょうどいい大きさに設定してください */
            transform: scale(1.0); 
            transform-origin: 0 0;

            /* 2. 左右の位置（真ん中に来るように調整） */
            left: -250px; 

            /* ---ここからが新しい調整方法です--- */

            /* 読み込む元のサイトの幅（拡大前） */
            width: 1000px; 
            /* 読み込む元のサイトの高さ（★ここをすごく大きくする★） */
            /* これにより、拡大しても「下の余白」がiframe内に収まります */
            height: 2000px; 

            /* 3. 上下の位置（★最重要★） */
            /* マイナスの値を大きくして、数値部分だけを画面上部に引っ張り上げます */
            /* 数値の「すぐ上」にあった余白が消えるまで、この数字を調整してください */
            top: -600px; 
            
            /* ★★★ ここまで ★★★ */
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe src="https://www2.edam.ne.jp/Public/00642/Sokutei/SSC/RN?LoID=738"></iframe>
    </div>
</body>
</html>
