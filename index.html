<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        /* 窓の大きさ（サイネージの画面全体） */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 中身の調整 */
        iframe {
            position: absolute;
            border: none;
            width: 1000px; /* 元サイトを一旦大きく読み込む（固定） */
            height: 1000px;

            /* ★★★ ここから下の3つの数字を調整してください ★★★ */

            /* 1. 大きさ（ズーム倍率） */
            transform: scale(1.5); 
            transform-origin: 0 0;

            /* 2. 左右の位置（マイナスを増やすと右に動く） */
            left: -50px; 

            /* 3. 上下の位置（マイナスを増やすと下に動く） */
            top: -240px; 
            
            /* ★★★ ここまで ★★★ */
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe src="https://www2.edam.ne.jp/Public/00642/Sokutei/SSC/RN?LoID=738"></iframe>
    </div>
</body>
</html>
