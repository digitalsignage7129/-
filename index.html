<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Signage View</title>
    <style>
        /* 画面全体の余白を消す */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* 背景を黒にして視認性を高める */
        }

        /* 窓の役割をするコンテナ */
        .window {
            position: absolute;
            width: 100vw;   /* サイネージの横幅いっぱい */
            height: 100vh;  /* サイネージの縦幅いっぱい */
            overflow: hidden;
        }

        /* 中に読み込む元のサイトの設定 */
        iframe {
            position: absolute;
            border: none;

            /* 【調整ポイント1：位置】 */
            /* 数値が真ん中に来るようにマイナス値を調整してください */
            top: -240px;   /* 上にずらす量 */
            left: -10px;   /* 左にずらす量 */

            /* 【調整ポイント2：大きさ】 */
            /* 元のサイトを何倍に拡大するか（サイネージに合わせて調整） */
            transform: scale(2.5); 
            transform-origin: 0 0;

            /* 元のサイト自体の幅（拡大前の基準サイズ） */
            width: 500px; 
            height: 800px;
        }
    </style>
</head>
<body>
    <div class="window">
        <iframe src="https://www2.edam.ne.jp/Public/00642/Sokutei/SSC/RN?LoID=738"></iframe>
    </div>
</body>
</html>
